
services:
  mongodb:
    image: mongo:latest
    container_name: ohrbob-mongo
    ports:
      - "${MONGO_PORT:-27019}:27017"
    volumes:
      - mongodb_data:/data/db

  ohrbob.api:
    image: ${DOCKER_REGISTRY-}ohrbob.api:${RELEASE_TAG:-beta}
    build:
      context: .
      dockerfile: Ohrbob.Api/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev-local}
        RELEASE_TAG: ${RELEASE_TAG:-beta}
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - MongoDbData__ConnectionString=${MongoDbData__ConnectionString:-mongodb://mongodb:27017/OhrbobData}
      - MongoDbData__DatabaseName=${MongoDbData__DatabaseName:-OhrbobData}
      - MongoDbLogs__ConnectionString=${MongoDbLogs__ConnectionString:-mongodb://mongodb:27017/OhrbobLogs}
      - MongoDbLogs__DatabaseName=${MongoDbLogs__DatabaseName:-OhrbobLogs}
      - ApiKeys__0__Key=${ApiKeys__0__Key:-}
      - ApiKeys__0__Name=${ApiKeys__0__Name:-web}
      - ApiKeys__0__Scopes__0=${ApiKeys__0__Scopes__0:-all}
    ports:
      - "${API_PORT:-5001}:8080"
    depends_on:
      - mongodb

  ohrbob.player:
    image: ${DOCKER_REGISTRY-}ohrbob.player:${RELEASE_TAG:-beta}
    build:
      context: .
      dockerfile: Ohrbob.Player/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev-local}
        RELEASE_TAG: ${RELEASE_TAG:-beta}
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - MongoDbData__ConnectionString=${MongoDbData__ConnectionString:-mongodb://mongodb:27017/OhrbobData}
      - MongoDbData__DatabaseName=${MongoDbData__DatabaseName:-OhrbobData}
      - MongoDbLogs__ConnectionString=${MongoDbLogs__ConnectionString:-mongodb://mongodb:27017/OhrbobLogs}
      - MongoDbLogs__DatabaseName=${MongoDbLogs__DatabaseName:-OhrbobLogs}
    ports:
      - "${PLAYER_PORT:-5002}:8080"
    depends_on:
      - mongodb

  ohrbob.web:
    image: ${DOCKER_REGISTRY-}ohrbob.web:${RELEASE_TAG:-beta}
    build:
      context: .
      dockerfile: Ohrbob.Web/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev-local}
        RELEASE_TAG: ${RELEASE_TAG:-beta}
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - OhrbobApi__BaseUrl=${OhrbobApi__BaseUrl:-http://ohrbob.api:8080/api}
      - OhrbobApi__ApiKey=${OhrbobApi__ApiKey:-}
      - OhrbobApi__PlayerApiUrl=${OhrbobApi__PlayerApiUrl:-http://ohrbob.player:8080}
      - OhrbobApi__PlayerPublicUrl=${OhrbobApi__PlayerPublicUrl:-https://player.ohrbob.org}
      - Oidc__Google__Authority=${Oidc__Google__Authority:-https://accounts.google.com}
      - Oidc__Google__ClientId=${Oidc__Google__ClientId:-}
      - Oidc__Google__ClientSecret=${Oidc__Google__ClientSecret:-}
      - Oidc__Nextcloud__Authority=${Oidc__Nextcloud__Authority:-}
      - Oidc__Nextcloud__ClientId=${Oidc__Nextcloud__ClientId:-}
      - Oidc__Nextcloud__ClientSecret=${Oidc__Nextcloud__ClientSecret:-}
      - Oidc__GitHub__ClientId=${Oidc__GitHub__ClientId:-}
      - Oidc__GitHub__ClientSecret=${Oidc__GitHub__ClientSecret:-}
      - Legal__Show=${Legal__Show:-false}
      - Legal__Name=${Legal__Name:-}
      - Legal__Address=${Legal__Address:-}
      - Legal__Email=${Legal__Email:-}
      - PodcastIndex__ApiKey=${PodcastIndex__ApiKey:-}
      - PodcastIndex__ApiSecret=${PodcastIndex__ApiSecret:-}
    ports:
      - "${WEB_PORT:-5003}:8080"
    depends_on:
      - ohrbob.api

volumes:
  mongodb_data:
