
services:
  mongodb:
    image: mongo:latest
    container_name: ohrbob-mongo
    ports:
      - "27019:27017"
    volumes:
      - mongodb_data:/data/db

  ohrbob.api:
    image: ${DOCKER_REGISTRY-}ohrbobapi
    build:
      context: .
      dockerfile: Ohrbob.Api/Dockerfile
    env_file:
      - Ohrbob.Api/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDbLogs__ConnectionString=mongodb://mongodb:27017/OhrbobLogs
      - MongoDbData__ConnectionString=mongodb://mongodb:27017/OhrbobData
    ports:
      - "5001:8080"
    depends_on:
      - mongodb

  ohrbob.player:
    image: ${DOCKER_REGISTRY-}ohrbobplayer
    build:
      context: .
      dockerfile: Ohrbob.Player/Dockerfile
    env_file:
      - Ohrbob.Player/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDbLogs__ConnectionString=mongodb://mongodb:27017/OhrbobLogs
      - MongoDbData__ConnectionString=mongodb://mongodb:27017/OhrbobData
    ports:
      - "5002:8080"
    depends_on:
      - mongodb

  ohrbob.web:
    image: ${DOCKER_REGISTRY-}ohrbobweb
    build:
      context: .
      dockerfile: Ohrbob.Web/Dockerfile
    env_file:
      - Ohrbob.Web/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OhrbobApi__BaseUrl=http://ohrbob.api:8080/api
    ports:
      - "5003:8080"
    depends_on:
      - ohrbob.api

volumes:
  mongodb_data:
